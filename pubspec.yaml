name: shujing
description: 书径 —— 简约毛玻璃风格的本地阅读 App（兼容阅读3.0书源）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  sqflite_common_ffi_web: ^0.4.5
  path: ^1.9.0
  path_provider: ^2.1.5
  dio: ^5.7.0
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.1.1
  html: ^0.15.5
  shared_preferences: ^2.3.3
  flutter_tts: ^4.2.0
  flutter_js: ^0.8.1
  intl: ^0.20.2
  crypto: ^3.0.6
  file_picker: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
