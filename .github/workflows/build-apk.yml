name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        # 只打 arm64-v8a：省掉 armeabi-v7a / x86_64 两套原生库，体积大幅下降
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shujing-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk shujing-v0.1.1.apk

      # 发布为 Release 资源，得到一个无需登录、手机可直接点开的公开下载链接
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: 书径 v0.1.1 —— Android 安装包
          files: shujing-v0.1.1.apk
          body_path: RELEASE_NOTES.md

      # 同步一份到 Gitee：国内直连下载，绕开 GitHub 的跨境链路
      # 上传前会先删除同名旧附件，因为 Gitee 不覆盖只累积
      - name: Sync to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          python3 scripts/sync_gitee_release.py \
            --owner youzhai22 \
            --repo shujing \
            --tag v0.1.1 \
            --file shujing-v0.1.1.apk \
            --title "书径 v0.1.1 —— Android 安装包" \
            --notes-file RELEASE_NOTES.md \
            --ref master
